name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dependency boundaries
        run: pnpm depcruise

      - name: Service-role key is unreachable from any client bundle
        run: pnpm guard:server-only

      - name: Test (no credentials needed — core & adapters run with zero env vars)
        run: pnpm test

      - name: Build
        run: pnpm build
