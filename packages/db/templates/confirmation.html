<!doctype html>
<html lang="en">
  <!--
    The link is built from RedirectTo, the address the route handler passed as
    emailRedirectTo, which already carries the ?next= the visitor was heading
    for. Hard-coding a path instead silently drops it and lands everyone on the
    same page.

    Two whole anchors rather than one with a conditional href: Go's html/template
    refuses to autoescape a URL whose context it cannot work out, and a
    conditional at the very start of an href is exactly that. Nothing in this
    comment may use the template delimiters either — Go parses comments, so the
    word "if" between braces here is an action with no argument, and a template
    that fails to parse is not an error anybody sees. GoTrue falls back to its
    own default template and sends that instead.
  -->
  <body style="font-family: ui-sans-serif, system-ui, sans-serif; line-height: 1.6; color: #1c1b22">
    <h2 style="font-family: ui-serif, Georgia, serif; font-weight: 600">Confirm your account</h2>
    <p>One click and your Planar Standard account is ready.</p>
    <p>
      {{ if .RedirectTo }}
      <a
        href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup"
        style="display: inline-block; background: #1c1b22; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none"
        >Confirm my account</a
      >
      {{ else }}
      <a
        href="{{ .SiteURL }}/auth/confirm?next=%2Fprofile&token_hash={{ .TokenHash }}&type=signup"
        style="display: inline-block; background: #1c1b22; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none"
        >Confirm my account</a
      >
      {{ end }}
    </p>
    <p style="color: #6b6a75; font-size: 14px">If you did not sign up, you can ignore this email and nothing will happen.</p>
  </body>
</html>
